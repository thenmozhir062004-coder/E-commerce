<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LAVÉRA - Checkout</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<header>

    <div class="logo">
        LAVÉRA
    </div>

    <nav>

        <a href="home.html">Home</a>

        <a href="categories.html">
            Categories
        </a>

        <a href="offers.html">
            Offers
        </a>

        <a href="my-account.html">
            My Account
        </a>

        <a href="cart.html">
            🛒 Cart
        </a>

    </nav>

</header>


<section class="page-heading">

    <p>COMPLETE YOUR ORDER</p>

    <h1>Checkout</h1>

</section>


<section class="checkout-page">


    <!-- CUSTOMER DETAILS -->

    <div class="checkout-form">

        <h2>
            Delivery Information
        </h2>


        <div class="two-input">

            <div>

                <label>
                    First Name
                </label>

                <input
                    type="text"
                    placeholder="First Name"
                >

            </div>


            <div>

                <label>
                    Last Name
                </label>

                <input
                    type="text"
                    placeholder="Last Name"
                >

            </div>

        </div>


        <label>
            Email Address
        </label>

        <input
            type="email"
            placeholder="Enter your email"
        >


        <label>
            Mobile Number
        </label>

        <input
            type="tel"
            placeholder="Enter mobile number"
        >


        <label>
            Address
        </label>

        <textarea
            placeholder="Enter your complete address"
        ></textarea>


        <div class="two-input">

            <div>

                <label>
                    City
                </label>

                <input
                    type="text"
                    placeholder="City"
                >

            </div>


            <div>

                <label>
                    Pincode
                </label>

                <input
                    type="text"
                    placeholder="Pincode"
                >

            </div>

        </div>


        <h2>
            Payment Method
        </h2>


        <label class="payment-option">

            <input
                type="radio"
                name="payment"
                checked
            >

            Cash on Delivery

        </label>


        <label class="payment-option">

            <input
                type="radio"
                name="payment"
            >

            UPI

        </label>


        <label class="payment-option">

            <input
                type="radio"
                name="payment"
            >

            Credit / Debit Card

        </label>

    </div>


    <!-- SUMMARY -->

    <div class="checkout-summary">

        <h2>
            Your Order
        </h2>


        <div class="checkout-product">

            <img
                src="images/dress1.jpg"
                alt="Dress"
            >

            <div>

                <h3>
                    Floral Midi Dress
                </h3>

                <p>
                    Quantity: 1
                </p>

            </div>

            <strong>
                ₹999
            </strong>

        </div>


        <hr>


        <p>

            <span>Subtotal</span>

            <span>₹1,499</span>

        </p>


        <p>

            <span>Discount</span>

            <span>- ₹500</span>

        </p>


        <p>

            <span>Delivery</span>

            <span>FREE</span>

        </p>


        <hr>


        <h3 class="total">

            <span>Total</span>

            <span>₹999</span>

        </h3>


        <a
            href="order-success.html"
            class="main-btn"
        >
            PLACE ORDER
        </a>

    </div>

</section>


<footer>

    <h2>LAVÉRA</h2>

    <p>© 2026 LAVÉRA Fashion Store</p>

</footer>


</body>
</html>
