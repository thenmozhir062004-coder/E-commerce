<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LAVÉRA - Cart</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<header>

    <div class="logo">
        LAVÉRA
    </div>

    <nav>

        <a href="home.html">Home</a>

        <a href="categories.html">
            Categories
        </a>

        <a href="offers.html">
            Offers
        </a>

        <a href="my-account.html">
            My Account
        </a>

        <a href="cart.html">
            🛒 Cart
        </a>

    </nav>

</header>


<section class="page-heading">

    <p>SHOPPING BAG</p>

    <h1>Your Cart</h1>

</section>


<section class="cart-page">

    <div class="cart-item">

        <img
            src="https://www.veromoda.in/cdn/shop/files/902320001_g0_a17d59bd-12e0-407f-94a5-543527257ed7.jpg?v=1773656250&width=1080"
            alt="Floral Midi Dress"
        >


        <div class="cart-product-info">

            <small>WOMEN / DRESSES</small>

            <h2>
                Floral Midi Dress
            </h2>

            <p>
                Size: M
            </p>

            <p>
                Color: black
            </p>

            <a href="#">
                Remove
            </a>

        </div>


        <div class="quantity">

            <button>-</button>

            <span>1</span>

            <button>+</button>

        </div>


        <h3>
            ₹1,499
        </h3>

    </div>


    <div class="cart-summary">

        <h2>
            Order Summary
        </h2>


        <p>

            <span>Subtotal</span>

            <span>₹1,499</span>

        </p>


        <p>

            <span>Discount</span>

            <span>- ₹500</span>

        </p>


        <p>

            <span>Delivery</span>

            <span>FREE</span>

        </p>


        <hr>


        <h3>

            <span>Total</span>

            <span>₹999</span>

        </h3>


        <a
            href="checkout.html"
            class="main-btn"
        >
            PROCEED TO CHECKOUT
        </a>

    </div>

</section>


<footer>

    <h2>LAVÉRA</h2>

    <p>© 2026 LAVÉRA Fashion Store</p>

</footer>


</body>
</html>
